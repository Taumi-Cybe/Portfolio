---
version: "3.9"
services:
  minecraft-server:
    image: itzg/minecraft-server
    ports:
      - "25565:25565"
    restart: always
    environment:
      EULA: TRUE
    stdin_open: true
    tty: true
    healthcheck:
      test: >
        curl -s localhost:25565 > /dev/null; [ $$? -eq 1 ] && echo "Server alive" || echo "Server dead"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 1m
