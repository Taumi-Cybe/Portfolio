---
version: "3.9"
services:
  blue-eyes-white-dragon1:
    build: .
    tty: true
    ports:
      - "3000:3000"

  blue-eyes-white-dragon2:
    build: .
    tty: true
    ports:
      - "3001:3000"

  blue-eyes-white-dragon3:
    build: .
    tty: true
    ports:
      - "3002:3000"

  polymerization:
    image: curlimages/curl
    depends_on:
      - blue-eyes-white-dragon1
      - blue-eyes-white-dragon2
      - blue-eyes-white-dragon3
    command: sh -c "curl blue-eyes-white-dragon1:3000 && curl blue-eyes-white-dragon2:3000 && curl blue-eyes-white-dragon3:3000"
